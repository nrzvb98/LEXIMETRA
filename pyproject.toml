[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leximetra"
version = "0.2.0"
description = "Automatic trial analysis and reaction-time verification for speech recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6",
    "numpy",
    "pydub",
    "sounddevice",
    "soundfile",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
packaging = [
    "pyinstaller>=6.20",
]
# Automatic beep/VAD processing (src/leximetra/processing). Optional: without it
# the app runs exactly as before and reports the capability as unavailable.
# torchaudio is unused by the pipeline but required by Silero's hubconf.
# No macOS x86_64 wheels exist for these torch versions, so the Intel build
# ships without this extra.
processing = [
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
]

[project.scripts]
leximetra = "leximetra.app:main"
# Kept so existing shells and notes that call `hala-rt` still work.
hala-rt = "leximetra.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"leximetra.processing" = [
    "templates/*.wav",
    "VERSION",
    # Bundled Silero VAD, so the model loads locally instead of being fetched
    # from GitHub on first run. Vendored by tools/vendor_silero.py.
    "silero/hubconf.py",
    "silero/LICENSE",
    "silero/VENDORED.md",
    "silero/src/silero_vad/*.py",
    "silero/src/silero_vad/data/*.jit",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: runs the real processing pipeline (needs the 'processing' extra)",
]
